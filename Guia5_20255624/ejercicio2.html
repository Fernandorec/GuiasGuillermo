<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="./js/pedidos.js" defer></script>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Registro de pedidos</h1>

      <button id="btnAgregar" class="btn btn-primary mb-4">
        Agregar pedido
      </button>

      <h2 class="h4">Filtrar productos</h2>

      <div class="row g-2 align-items-end mb-4">
        <div class="col-12 col-md-4">
          <label for="precioMaximo" class="form-label">Precio máximo:</label>
          <input
            type="number"
            id="precioMaximo"
            class="form-control"
            min="0.01"
            step="0.01"
          />
        </div>

        <div class="col-12 col-md-8 d-flex flex-wrap gap-2">
          <button id="btnFiltrar" class="btn btn-success">
            Filtrar productos
          </button>
          <button id="btnMostrarTodos" class="btn btn-secondary">
            Mostrar todos
          </button>
          <button id="btnLimpiar" class="btn btn-danger">
            Limpiar pedidos
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>Producto</th>
              <th>Precio unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="tablaPedidos"></tbody>
        </table>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <p class="mb-2">
            Total de unidades solicitadas:
            <span id="totalUnidades" class="fw-bold">0</span>
          </p>
          <p class="mb-0">
            Monto total de los pedidos: $
            <span id="montoTotal" class="fw-bold">0.00</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
